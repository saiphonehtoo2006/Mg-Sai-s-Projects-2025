<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form Design</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <div class="container">
            <div class="image-container">
                <img src="images/bg1.jpg" alt="backgroundimage">
            </div>
            <form action="">
                <h1>Welcome!</h1>
                <p>Please Enter Your Account</p>
                
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter Your Email">
                    </div>
                    <div class="form-group">
                        <label for="passowrd">Password</label>
                        <input type="password" id="passowrd" placeholder="Enter Your passowrd">
                    </div>
                     <div class="form-group">
                        <label for="confirmpassowrd">Confirm Password</label>
                        <input type="confirmpassword" id="confirmpassowrd" placeholder="Confirm Password">
                    </div>
                    <div class="options">
                        <div class="check-box">
                        <input type="checkbox" name="rememberme" id="remember">
                        <label for="remember">Remember me</label>
                        </div>
                        <a href="#">Forget Password?</a>
                    </div>

                    <button type="submit">Login</button>
                    <p class="sign-up">
                        Don't have an account.<a href="#"> Sign up</a>
                    </p>
            </form>
            
        </div>
</body>
</html>
